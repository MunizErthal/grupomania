<main class="login">
  <form class="login__card" (submit)="submit($event)" novalidate>
    <img src="logos/grupo.png" alt="Grupo Mania D'Água" width="140" height="81" />
    <h1>Painel do site</h1>
    <label>
      <span>E-mail</span>
      <input name="email" type="email" autocomplete="username" required />
    </label>
    <label>
      <span>Senha</span>
      <input name="password" type="password" autocomplete="current-password" required />
    </label>
    @if (error()) { <p class="err" role="alert">{{ error() }}</p> }
    <button class="btn btn--primary" type="submit" [disabled]="busy()">{{ busy() ? 'Entrando…' : 'Entrar' }}</button>
    @if (mode === 'local') {
      <p class="hint">Modo local: o Firebase ainda não foi configurado. As alterações ficam só neste navegador.</p>
    }
  </form>
</main>
